version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports: ["8501:8501"]
    depends_on: [api]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
